
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leader Strike</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #151515;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    h2 { margin: 12px; }
    .game {
      width: 100%;
      height: calc(100vh - 55px);
      min-height: 500px;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <h2>Leader Strike</h2>
  <div class="game">
    <iframe
      src="https://www.miniplay.com/embed/leader-strike"
      title="Leader Strike"
      allow="fullscreen; autoplay; gamepad"
      allowfullscreen>
    </iframe>
  </div>
</body>
</html>
